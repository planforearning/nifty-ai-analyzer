<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIFTY AI Analyzer Pro - Live Signals</title>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #0f172a; 
            color: #fff; 
            padding: 15px; 
            margin: 0; 
        }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { text-align: center; font-size: 22px; color: #38bdf8; margin-bottom: 15px; }
        .card { background: #1e293b; border-radius: 12px; padding: 16px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .row { display: flex; justify-content: space-between; margin: 10px 0; font-size: 0.95rem; border-bottom: 1px solid #334155; padding-bottom: 6px; }
        .row:last-child { border-bottom: none; }
        .buy-badge { background: #22c55e; color: #fff; padding: 4px 10px; border-radius: 6px; font-weight: bold; }
        .sell-badge { background: #ef4444; color: #fff; padding: 4px 10px; border-radius: 6px; font-weight: bold; }
        .neutral-badge { background: #eab308; color: #000; padding: 4px 10px; border-radius: 6px; font-weight: bold; }
        small { color: #94a3b8; display: block; margin-top: 10px; text-align: center; font-size: 0.8rem; }
        canvas { width: 100% !important; height: 220px !important; }
    </style>
</head>
<body>

<div class="container">
    <h1>NIFTY AI Analyzer Pro</h1>
    
    <!-- Chart Card -->
    <div class="card">
        <canvas id="chart"></canvas>
    </div>
    
    <!-- Signal & Data Summary Card -->
    <div class="card">
        <div class="row"><span>Last Close</span><b id="last">-</b></div>
        <div class="row"><span>RSI (14)</span><b id="rsi">-</b></div>
        <div class="row"><span>SMA (5) vs SMA (20)</span><b id="trend">-</b></div>
        <div class="row"><span>AI Trade Signal</span><span id="signalBadge">-</span></div>
        <small id="note">Sirf learning aur analysis ke liye, trading advice nahi.</small>
    </div>
</div>

<script>
    function sma(arr, n){ 
        return Number((arr.slice(-n).reduce((a,b)=>a+b,0)/n).toFixed(2)); 
    }
    
    function rsi(arr, n=14){
        let gain=0, loss=0;
        for(let i=arr.length-n; i<arr.length; i++){
            const d = arr[i]-arr[i-1];
            if(d>=0) gain+=d; else loss-=d;
        }
        if(loss===0) return 100;
        return Number((100 - (100 / (1 + gain/loss))).toFixed(1));
    }

    // Sample Data (Yahan aap live ya naya data daal sakte hain)
    const labels = ['13 Aug', '28 Aug', '15 Sep', '30 Sep', '16 Oct', '03 Nov', '13 Nov'];
    const prices = [24200, 23800, 23200, 22400, 22800, 24500, 25144.30];

    const lastPrice = prices[prices.length-1];
    const currentRsi = rsi(prices);
    const s5 = sma(prices, 5);
    const s20 = sma(prices, 20);

    document.getElementById('last').innerText = lastPrice;
    document.getElementById('rsi').innerText = currentRsi;
    document.getElementById('trend').innerText = s5 > s20 ? "Bullish (SMA5 > SMA20)" : "Bearish (SMA5 < SMA20)";

    // AI Buy / Sell Logic
    const signalBadge = document.getElementById('signalBadge');
    if(currentRsi > 70) {
        signalBadge.innerHTML = '<span class="sell-badge">OVERBOUGHT / CAUTION (SELL ZONE)</span>';
    } else if(currentRsi < 30) {
        signalBadge.innerHTML = '<span class="buy-badge">OVERSOLD (BUY OPPORTUNITY)</span>';
    } else if(s5 > s20) {
        signalBadge.innerHTML = '<span class="buy-badge">STRONG BUY (MOMENTUM)</span>';
    } else {
        signalBadge.innerHTML = '<span class="neutral-badge">HOLD / NEUTRAL</span>';
    }

    // Render Chart
    const ctx = document.getElementById('chart').getContext('2d');
    new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                label: 'NIFTY',
                data: prices,
                borderColor: '#0ea5e9',
                borderWidth: 2,
                pointRadius: 4,
                fill: false
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                x: { ticks: { color: '#94a3b8' }, grid: { display: false } },
                y: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } }
            }
        }
    });
</script>

</body>
</html>
