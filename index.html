<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NIFTY AI Analyzer</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  body { font-family: sans-serif; background:#0f172a; color:#fff; padding:16px; margin:0; }
  h1 { text-align:center; font-size:22px; }
  .card { background:#1e293b; border-radius:12px; padding:16px; margin:16px auto; max-width:500px; }
  .row { display:flex; justify-content:space-between; margin:8px 0; }
  .up { color:#22c55e; } .down { color:#ef4444; }
  small { color:#94a3b8; }
</style>
</head>
<body>
  <h1>NIFTY AI Analyzer</h1>
  <div class="card">
    <canvas id="chart"></canvas>
  </div>
  <div class="card">
    <div class="row"><span>RSI (14)</span><b id="rsi">-</b></div>
    <div class="row"><span>SMA (5)</span><b id="sma">-</b></div>
    <div class="row"><span>Signal</span><b id="signal">-</b></div>
    <small>Abhi sample data hai. Live data baad mein jodenge.</small>
  </div>

<script>
const prices = [24100,24180,24120,24250,24310,24280,24400,24370,24450,24520,
                24480,24560,24610,24580,24690,24720,24660,24780,24830,24810];

function sma(arr, n){ return arr.slice(-n).reduce((a,b)=>a+b,0)/n; }

function rsi(arr, n=14){
  let gain=0, loss=0;
  for(let i=arr.length-n; i<arr.length; i++){
    const d = arr[i]-arr[i-1];
    if(d>=0) gain+=d; else loss-=d;
  }
  if(loss===0) return 100;
  return 100 - 100/(1 + gain/loss);
}

const r = rsi(prices), s = sma(prices,5);
document.getElementById('rsi').textContent = r.toFixed(1);
document.getElementById('sma').textContent = s.toFixed(0);

const sig = document.getElementById('signal');
if(r>70){ sig.textContent='Overbought'; sig.className='down'; }
else if(r<30){ sig.textContent='Oversold'; sig.className='up'; }
else { sig.textContent='Neutral'; }

new Chart(document.getElementById('chart'), {
  type:'line',
  data:{ labels: prices.map((_,i)=>'D'+(i+1)),
         datasets:[{ label:'NIFTY (sample)', data:prices, borderColor:'#38bdf8', tension:0.3 }]},
  options:{ plugins:{ legend:{ labels:{ color:'#fff' } } },
            scales:{ x:{ ticks:{ color:'#94a3b8' } }, y:{ ticks:{ color:'#94a3b8' } } } }
});
</script>
</body>
</html>
